plugins {
    id 'com.android.application'
}

def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
if (ciRunNumber == null || ciRunNumber.trim().isEmpty()) {
    ciRunNumber = "1"
}

android {
    namespace 'app.github.mmp1988.dastyareman'
    compileSdk 35

    defaultConfig {
        applicationId 'app.github.mmp1988.dastyareman'
        minSdk 24
        targetSdk 35
        versionCode ciRunNumber.toInteger()
        versionName "1.0." + ciRunNumber
    }

    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
