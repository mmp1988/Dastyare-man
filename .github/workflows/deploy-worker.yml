name: Deploy Mina Smart Brain Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add repository secret CLOUDFLARE_API_TOKEN with Workers Scripts:Edit permission."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }
      - name: Deploy Worker with Workers AI binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify live Worker, CORS and real AI response
        env:
          MINA_WORKER_URL: https://mina-smart-brain.mehrdadmohammadi1988.workers.dev/
          MINA_ALLOWED_ORIGIN: https://mmp1988.github.io
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const base = process.env.MINA_WORKER_URL;
            const origin = process.env.MINA_ALLOWED_ORIGIN;
            const health = await fetch(base, { cache: 'no-store' });
            assert.equal(health.status, 200, 'Worker health request failed');
            const healthData = await health.json();
            assert.equal(healthData.status, 'ready');

            const preflight = await fetch(base, {
              method: 'OPTIONS',
              headers: {
                Origin: origin,
                'Access-Control-Request-Method': 'POST',
                'Access-Control-Request-Headers': 'content-type'
              }
            });
            assert.equal(preflight.status, 204, 'CORS preflight failed');
            assert.equal(preflight.headers.get('access-control-allow-origin'), origin);

            const response = await fetch(base, {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                mode: 'understand',
                message: 'نوبت آزمایشی را برای فردا ساعت ۱۸:۱۷ جابه‌جا کن'
              }),
              signal: AbortSignal.timeout(30000),
              cache: 'no-store'
            });
            const data = await response.json().catch(() => ({}));
            assert.equal(response.status, 200, 'Workers AI failed: ' + JSON.stringify(data));
            assert.equal(data.success, true, 'Workers AI returned failure: ' + JSON.stringify(data));
            assert.equal(typeof data.command, 'string');
            assert.ok(data.command.trim());
            console.log('LIVE_WORKER_AI_VERIFIED', JSON.stringify({
              health: healthData.status,
              cors: preflight.status,
              ai: 'success',
              commandLength: data.command.length
            }));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
