name: Build Native Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare offline app content
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          cp manifest.json app/src/main/assets/manifest.json
          cp icon-192.png app/src/main/assets/icon-192.png
          cp icon-512.png app/src/main/assets/icon-512.png
          cp icon-512.png app/src/main/res/drawable/ic_launcher.png

      - name: Configure persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dastyare-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/dastyare-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          gradle --no-daemon assembleRelease
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Dastyare-man.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 output/Dastyare-man.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs output/Dastyare-man.apk

      - name: Publish latest APK (stable URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dastyare-man Latest APK
          body: "نسخه مستقل اندروید دستیار من؛ داده‌ها در حافظه خصوصی برنامه نگهداری می‌شوند."
          files: output/Dastyare-man.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
