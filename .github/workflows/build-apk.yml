name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Signed APK
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
        run: |
          set -e
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$HOME/.bubblewrap" android-build

          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" \
            "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

          cat "$HOME/.bubblewrap/config.json"

          cd android-build

          MANIFEST_URL="https://mmp1988.github.io/Dastyare-man/manifest.json"
          echo "دریافت $MANIFEST_URL ..."
          curl -fsSL "$MANIFEST_URL" -o web-manifest.json

          node -e '
            const fs = require("fs");
            const webManifest = JSON.parse(fs.readFileSync("web-manifest.json", "utf8"));
            const startUrl = new URL(webManifest.start_url || "/Dastyare-man/", "https://mmp1988.github.io/Dastyare-man/").pathname;
            const iconRel = (webManifest.icons && webManifest.icons[0] && webManifest.icons[0].src) || "icon-512.png";
            const iconUrl = new URL(iconRel, "https://mmp1988.github.io/Dastyare-man/").href;

            const twaManifest = {
              packageId: "app.github.mmp1988.dastyareman",
              host: "mmp1988.github.io",
              name: webManifest.name || "دستیار من",
              launcherName: webManifest.short_name || "دستیار من",
              display: webManifest.display || "standalone",
              orientation: webManifest.orientation || "portrait",
              themeColor: webManifest.theme_color || "#1a73e8",
              themeColorDark: webManifest.theme_color || "#1a73e8",
              navigationColor: webManifest.background_color || "#ffffff",
              navigationColorDark: webManifest.background_color || "#121212",
              navigationDividerColor: "#00000000",
              navigationDividerColorDark: "#00000000",
              backgroundColor: webManifest.background_color || "#ffffff",
              enableNotifications: true,
              startUrl: startUrl,
              iconUrl: iconUrl,
              maskableIconUrl: iconUrl,
              splashScreenFadeOutDuration: 300,
              signingKey: {
                path: "./release.keystore",
                alias: "dastyare"
              },
              appVersionName: "1.0." + (process.env.GITHUB_RUN_NUMBER || "1"),
              appVersionCode: Number(process.env.GITHUB_RUN_NUMBER || 1),
              shortcuts: [],
              generatorApp: "bubblewrap-cli",
              webManifestUrl: "https://mmp1988.github.io/Dastyare-man/manifest.json",
              fallbackType: "customtabs",
              features: {},
              alphaDependencies: {
                enabled: false
              },
              enableSiteSettingsShortcut: true,
              isChromeOSOnly: false,
              isMetaQuest: false,
              fullScopeUrl: "https://mmp1988.github.io/Dastyare-man/",
              minSdkVersion: 21,
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME
            };

            fs.writeFileSync("twa-manifest.json", JSON.stringify(twaManifest, null, 2));
          '

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias dastyare \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Mina-Msvm, OU=Dastyare-man, O=Dastyare-man, L=Tehran, S=Tehran, C=IR"

          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

          APK=$(find . -type f -name "app-release-signed.apk" | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find . -type f -name "*.apk" ! -name "aligned.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "خطا: فایل APK ساخته نشد"
            find . -name "*.apk"
            exit 1
          fi

          if [[ "$APK" == *"unsigned"* ]]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
            "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-key-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --out ../Dastyare-man.apk \
              aligned.apk
          else
            cp "$APK" ../Dastyare-man.apk
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -c -v 4 ../Dastyare-man.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../Dastyare-man.apk
          ls -lh ../Dastyare-man.apk

      - name: Publish Latest GitHub Release with Dastyare-man.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dastyare-man Latest APK"
          body: "نسخه امضاشده و آماده نصب اپلیکیشن دستیار من (به‌روزرسانی خودکار)"
          files: Dastyare-man.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
