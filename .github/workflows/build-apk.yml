name: Build and Release Signed APK

on:
  push:
    branches: [main, master]
    paths:
      # Ship the current web app inside newly built APKs as well as through the
      # in-app updater, so a fresh install has the latest features even offline.
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web app JavaScript and manifest
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>", html, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline app script, found {len(scripts)}")
          Path("/tmp/dastyare-app.js").write_text(scripts[0], encoding="utf-8")
          json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          print("Inline JavaScript extracted; manifest JSON is valid.")
          PY
          node --check /tmp/dastyare-app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare app assets and existing launcher icon
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          cp manifest.json app/src/main/assets/manifest.json
          cp icon-192.png app/src/main/assets/icon-192.png
          cp icon-512.png app/src/main/assets/icon-512.png
          cp icon-512.png app/src/main/res/drawable/ic_launcher.png

      - name: Configure persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets are not configured. An unsigned test APK will be uploaded only."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dastyare-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/dastyare-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        run: |
          set -e
          gradle --no-daemon clean assembleRelease --stacktrace
          mkdir -p output
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" output/Dastyare-man.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 output/Dastyare-man.apk
          if [ "$SIGNING_READY" = "true" ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs output/Dastyare-man.apk
          else
            echo "Unsigned APK generated for validation only."
          fi

      - name: Upload test APK
        if: env.SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dastyare-man-unsigned-validation
          path: output/Dastyare-man.apk
          retention-days: 3

      - name: Publish latest signed APK (stable URL)
        if: env.SIGNING_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dastyare-man Latest APK
          body: "نسخه مستقل اندروید دستیار من؛ آیکون اصلی سایت و داده‌های خصوصی هر گوشی."
          files: output/Dastyare-man.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
