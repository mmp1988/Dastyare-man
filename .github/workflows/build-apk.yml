name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android Command Line Tools & Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build & Sign APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          mkdir -p android-build && cd android-build
          printf "y\n" | bubblewrap init --manifest=https://mmp1988.github.io/Dastyare-man/manifest.json || true
          keytool -genkeypair -v -keystore release.keystore -alias dastyare -keyalg RSA -keysize 2048 -validity 10000 -storepass dastyare123 -keypass dastyare123 -dname "CN=Mina-Msvm, OU=Dastyare-man, O=Dastyare-man, L=Tehran, S=Tehran, C=IR"
          bubblewrap build --skipPwaValidation
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -p -f 4 "$APK_FILE" ../aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-key-pass pass:dastyare123 --ks-pass pass:dastyare123 --out ../Dastyare-man.apk ../aligned.apk

      - name: Publish Latest GitHub Release with Dastyare-man.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dastyare-man Latest APK"
          body: "نسخه امضاشده و آماده نصب اپلیکیشن دستیار من (به‌روزرسانی خودکار)"
          files: Dastyare-man.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
