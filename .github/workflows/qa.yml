name: Offline and Data Safety QA - conversational AI

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'worker.js'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'worker.js'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate blind Persian conversation benchmark
        run: node tests/validate-mina-blind-benchmark.cjs
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Verify automatic AI provider failover
        run: node tests/worker-provider-failover.cjs
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No inline application script found');
          new vm.Script(html.slice(start + 8, end), { filename: 'index.html:inline-script' });
          console.log('Inline JavaScript syntax: PASS');
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify all 365 Persian relative day offsets and combined time phrases
        run: node tests/persian-relative-date-range.cjs
      - name: Run browser QA
        run: node tests/offline-data-smoke.cjs
      - name: Run mobile Safari WebKit smoke
        run: node tests/safari-webkit-smoke.cjs

  worker-health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Worker health without spending AI tokens
        env:
          MINA_WORKER_URL: https://mina-smart-brain.mehrdadmohammadi1988.workers.dev/
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const url = process.env.MINA_WORKER_URL;
            let response, data;
            for (let attempt = 0; attempt < 24; attempt++) {
              try {
                response = await fetch(url, { cache: 'no-store' });
                data = await response.json();
                if (response.ok && data.version === 'mina-ai-response-v28-gemini-primary') break;
              } catch (_) {}
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            assert.equal(response?.status, 200, 'Worker health endpoint must return HTTP 200');
            assert.equal(data?.status, 'ready', 'Worker must report ready');
            assert.equal(data?.version, 'mina-ai-response-v28-gemini-primary', 'Latest failover release must be deployed');
            assert.equal(data?.providers?.cloudflareAI, true, 'Cloudflare AI fallback binding must be present');
            assert.equal(data?.primaryModel, 'gemini-3.5-flash-lite', 'Gemini must be the configured primary model');
            console.log('Gemini primary secret configured:', data?.providers?.gemini === true);
            assert.equal(data?.providers?.groq, true, 'Groq fallback secret must be present');
            console.log('Mina Worker health: PASS', JSON.stringify(data));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

  cloud-ai-integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify one live AI request on demand
        env:
          MINA_WORKER_URL: https://mina-smart-brain.mehrdadmohammadi1988.workers.dev/
          MINA_ALLOWED_ORIGIN: https://mmp1988.github.io
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const base = process.env.MINA_WORKER_URL;
            const origin = process.env.MINA_ALLOWED_ORIGIN;
            const response = await fetch(base, {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify({ mode: 'understand', message: 'برای مشتری فردا ساعت ۱۷ نوبت مژه ثبت کن' }),
              signal: AbortSignal.timeout(60000),
              cache: 'no-store'
            });
            const data = await response.json().catch(() => ({}));
            assert.equal(response.status, 200, 'Live AI request must succeed: ' + JSON.stringify(data));
            assert.equal(data.success, true, 'Live AI response must report success');
            assert.ok(typeof data.command === 'string' && /[آ-ی]/u.test(data.command), 'Live AI must return a Persian command');
            console.log('Live provider:', JSON.stringify(data.provider || null));
            assert.equal(data.provider?.provider, 'gemini', 'Live primary request must be served by Gemini, not silently by a fallback');
            console.log('Mina live Gemini smoke: PASS');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
