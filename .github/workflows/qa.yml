name: Offline and Data Safety QA

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No inline application script found');
          new vm.Script(html.slice(start + 8, end), { filename: 'index.html:inline-script' });
          console.log('Inline JavaScript syntax: PASS');
          NODE
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser QA
        run: node tests/offline-data-smoke.cjs
