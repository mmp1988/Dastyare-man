<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7c3aed" />
  <title>دستیار من | Mina-Msvm</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #f6f4fb;
      --card: #ffffff;
      --text: #18181b;
      --muted: #64748b;
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --primary-soft: #f3e8ff;
      --accent: #0ea5e9;
      --success: #16a34a;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 6px 24px rgba(24, 24, 27, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Vazirmatn", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.88rem;
      opacity: 0.92;
    }

    .badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--card);
      padding: 6px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.92rem;
      background: #fafafa;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-soft {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 0.8rem;
      border-radius: 10px;
    }

    .item-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fcfbfe;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .item-title {
      font-weight: 800;
      font-size: 0.98rem;
    }

    .item-meta {
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .toast.show {
      opacity: 1;
    }

    .hidden {
      display: none;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1 id="salonTitleDisplay">دستیار من</h1>
          <p id="salonSubDisplay">سالن آرایش و زیبایی اِلی (@lash_by_mina.m)</p>
        </div>
        <span class="badge">Mina-Msvm</span>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="appointments">نوبت‌ها</button>
      <button class="tab-btn" data-tab="refill">لیست ترمیم</button>
      <button class="tab-btn" data-tab="settings">تنظیمات پیام</button>
    </div>

    <section id="tab-appointments">
      <div class="card">
        <h2>ثبت نوبت یا تایم دلخواه جدید</h2>
        <form id="appointmentForm">
          <div class="grid-2">
            <div class="field">
              <label for="clientName">نام مشتری</label>
              <input type="text" id="clientName" required />
            </div>
            <div class="field">
              <label for="clientPhone">شماره موبایل</label>
              <input type="tel" id="clientPhone" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label for="serviceName">نوع خدمت / ترمیم</label>
              <input type="text" id="serviceName" required />
            </div>
            <div class="field">
              <label for="apptDateTime">تاریخ و ساعت</label>
              <input type="datetime-local" id="apptDateTime" required />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label for="totalPrice">مبلغ کل (تومان)</label>
              <input type="number" id="totalPrice" min="0" step="1000" />
            </div>
            <div class="field">
              <label for="depositAmount">بیعانه پرداخت‌شده (تومان)</label>
              <input type="number" id="depositAmount" min="0" step="1000" />
            </div>
          </div>

          <div class="field">
            <label for="notes">توضیحات / تایم دلخواه یادآوری</label>
            <input type="text" id="notes" />
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">ثبت نوبت</button>
            <button type="button" id="sendToRefillBtn" class="btn btn-soft">ارسال تایم دلخواه به لیست ترمیم</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>نوبت‌های ثبت‌شده</h2>
        <div id="appointmentsList"></div>
      </div>
    </section>

    <section id="tab-refill" class="hidden">
      <div class="card">
        <h2>لیست ترمیم و یادآوری‌ها</h2>
        <div id="refillList"></div>
      </div>
    </section>

    <section id="tab-settings" class="hidden">
      <div class="card">
        <h2>تنظیمات متن پیام</h2>
        <div class="field">
          <label for="brandNameInput">نام مجموعه</label>
          <input type="text" id="brandNameInput" value="سالن آرایش و زیبایی اِلی (@lash_by_mina.m)" />
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="optShowPrice" checked />
          <label for="optShowPrice" style="margin:0;">نمایش مبلغ کل خدمت در پیام مشتری</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="optShowDeposit" checked />
          <label for="optShowDeposit" style="margin:0;">نمایش بیعانه پرداخت‌شده در پیام مشتری</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="optShowRemaining" checked />
          <label for="optShowRemaining" style="margin:0;">نمایش مانده حساب در پیام مشتری</label>
        </div>

        <div class="field" style="margin-top:10px;">
          <label for="customFooter">متن پایانی دلخواه پیام</label>
          <textarea id="customFooter" rows="2"></textarea>
        </div>

        <div class="actions">
          <button type="button" id="saveSettingsBtn" class="btn btn-primary">ذخیره تنظیمات</button>
          <button type="button" id="enableNotifBtn" class="btn btn-soft">فعال‌سازی اعلان مرورگر</button>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEYS = {
      APPOINTMENTS: "dastyare_appointments",
      REFILLS: "dastyare_refills",
      SETTINGS: "dastyare_settings"
    };

    const defaultSettings = {
      brandName: "سالن آرایش و زیبایی اِلی (@lash_by_mina.m)",
      showPrice: true,
      showDeposit: true,
      showRemaining: true,
      footer: ""
    };

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2600);
    }

    function loadData(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveData(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function formatMoney(num) {
      const n = Number(num || 0);
      return n.toLocaleString("fa-IR") + " تومان";
    }

    function formatDateFa(dtStr) {
      if (!dtStr) return "";
      const d = new Date(dtStr);
      if (isNaN(d.getTime())) return dtStr;
      return d.toLocaleString("fa-IR", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function normalizePhoneForWa(phone) {
      if (!phone) return "";
      let cleaned = phone.replace(/\D/g, "");
      if (cleaned.startsWith("00")) cleaned = cleaned.slice(2);
      if (cleaned.startsWith("0")) cleaned = "98" + cleaned.slice(1);
      return cleaned;
    }

    function buildClientMessage(item) {
      const settings = loadData(STORAGE_KEYS.SETTINGS, defaultSettings);
      const price = Number(item.totalPrice || 0);
      const deposit = Number(item.depositAmount || 0);
      const remaining = Math.max(0, price - deposit);

      const lines = [
        `سلام ${item.clientName || ""}`,
        settings.brandName ? `${settings.brandName}` : "",
        `خدمت: ${item.serviceName || ""}`,
        `زمان: ${formatDateFa(item.dateTime)}`
      ].filter(Boolean);

      if (settings.showPrice && price > 0) {
        lines.push(`مبلغ کل: ${formatMoney(price)}`);
      }
      if (settings.showDeposit && deposit > 0) {
        lines.push(`بیعانه: ${formatMoney(deposit)}`);
      }
      if (settings.showRemaining && price > 0) {
        lines.push(`مانده حساب: ${formatMoney(remaining)}`);
      }
      if (item.notes) {
        lines.push(`یادداشت: ${item.notes}`);
      }
      if (settings.footer) {
        lines.push("", settings.footer);
      }

      return lines.join("\n");
    }

    async function copyMessage(item) {
      const text = buildClientMessage(item);
      try {
        await navigator.clipboard.writeText(text);
        showToast("کپی شد");
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("کپی شد");
      }
    }

    function sendWhatsApp(item) {
      const text = encodeURIComponent(buildClientMessage(item));
      const waPhone = normalizePhoneForWa(item.phone);
      const url = waPhone
        ? `https://wa.me/${waPhone}?text=${text}`
        : `https://wa.me/?text=${text}`;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function sendSms(item) {
      const text = encodeURIComponent(buildClientMessage(item));
      const phone = (item.phone || "").trim();
      window.location.href = `sms:${phone}?body=${text}`;
    }

    function getFormPayload() {
      return {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        clientName: document.getElementById("clientName").value.trim(),
        phone: document.getElementById("clientPhone").value.trim(),
        serviceName: document.getElementById("serviceName").value.trim(),
        dateTime: document.getElementById("apptDateTime").value,
        totalPrice: Number(document.getElementById("totalPrice").value || 0),
        depositAmount: Number(document.getElementById("depositAmount").value || 0),
        notes: document.getElementById("notes").value.trim()
      };
    }

    function renderAppointments() {
      const listEl = document.getElementById("appointmentsList");
      const items = loadData(STORAGE_KEYS.APPOINTMENTS, []);
      if (!items.length) {
        listEl.innerHTML = '<div class="empty">موردی ثبت نشده است.</div>';
        return;
      }

      listEl.innerHTML = items.map(item => {
        const remaining = Math.max(0, Number(item.totalPrice || 0) - Number(item.depositAmount || 0));
        return `
          <div class="item-card">
            <div class="item-header">
              <div class="item-title">${item.clientName} — ${item.serviceName}</div>
              <span class="badge" style="background:var(--primary-soft);color:var(--primary-dark);">${formatDateFa(item.dateTime)}</span>
            </div>
            <div class="item-meta">
              ${item.phone ? `${item.phone} | ` : ""}
              مبلغ: ${formatMoney(item.totalPrice)} | بیعانه: ${formatMoney(item.depositAmount)} | مانده: ${formatMoney(remaining)}
              ${item.notes ? `<br/>${item.notes}` : ""}
            </div>
            <div class="actions">
              <button class="btn btn-soft btn-sm" onclick="moveToRefill('${item.id}')">ارسال به لیست ترمیم</button>
              <button class="btn btn-success btn-sm" onclick="sendWhatsAppById('appointments', '${item.id}')">واتساپ</button>
              <button class="btn btn-accent btn-sm" onclick="sendSmsById('appointments', '${item.id}')">پیامک</button>
              <button class="btn btn-soft btn-sm" onclick="copyById('appointments', '${item.id}')">کپی</button>
              <button class="btn btn-danger btn-sm" onclick="deleteItem('appointments', '${item.id}')">حذف</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRefills() {
      const listEl = document.getElementById("refillList");
      const items = loadData(STORAGE_KEYS.REFILLS, []);
      if (!items.length) {
        listEl.innerHTML = '<div class="empty">موردی در لیست ترمیم نیست.</div>';
        return;
      }

      listEl.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-header">
            <div class="item-title">${item.clientName} — ${item.serviceName}</div>
            <span class="badge" style="background:#fef3c7;color:#92400e;">${formatDateFa(item.dateTime)}</span>
          </div>
          <div class="item-meta">
            ${item.phone ? `${item.phone} | ` : ""}
            ${item.notes || ""}
          </div>
          <div class="actions">
            <button class="btn btn-success btn-sm" onclick="sendWhatsAppById('refills', '${item.id}')">واتساپ</button>
            <button class="btn btn-accent btn-sm" onclick="sendSmsById('refills', '${item.id}')">پیامک</button>
            <button class="btn btn-soft btn-sm" onclick="copyById('refills', '${item.id}')">کپی</button>
            <button class="btn btn-danger btn-sm" onclick="deleteItem('refills', '${item.id}')">حذف</button>
          </div>
        </div>
      `).join("");
    }

    function findItem(source, id) {
      const key = source === "refills" ? STORAGE_KEYS.REFILLS : STORAGE_KEYS.APPOINTMENTS;
      const list = loadData(key, []);
      return list.find(x => x.id === id);
    }

    window.sendWhatsAppById = (source, id) => {
      const item = findItem(source, id);
      if (item) sendWhatsApp(item);
    };

    window.sendSmsById = (source, id) => {
      const item = findItem(source, id);
      if (item) sendSms(item);
    };

    window.copyById = (source, id) => {
      const item = findItem(source, id);
      if (item) copyMessage(item);
    };

    window.deleteItem = (source, id) => {
      const key = source === "refills" ? STORAGE_KEYS.REFILLS : STORAGE_KEYS.APPOINTMENTS;
      const next = loadData(key, []).filter(x => x.id !== id);
      saveData(key, next);
      renderAppointments();
      renderRefills();
      showToast("حذف شد");
    };

    window.moveToRefill = (id) => {
      const appts = loadData(STORAGE_KEYS.APPOINTMENTS, []);
      const target = appts.find(x => x.id === id);
      if (!target) return;
      const refills = loadData(STORAGE_KEYS.REFILLS, []);
      refills.unshift(target);
      saveData(STORAGE_KEYS.REFILLS, refills);
      renderRefills();
      showToast("به لیست ترمیم منتقل شد");
    };

    document.getElementById("appointmentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const payload = getFormPayload();
      if (!payload.clientName || !payload.serviceName || !payload.dateTime) return;
      const appts = loadData(STORAGE_KEYS.APPOINTMENTS, []);
      appts.unshift(payload);
      saveData(STORAGE_KEYS.APPOINTMENTS, appts);
      renderAppointments();
      e.target.reset();
      showToast("ثبت شد");
    });

    document.getElementById("sendToRefillBtn").addEventListener("click", () => {
      const payload = getFormPayload();
      if (!payload.clientName || !payload.serviceName) return;
      const refills = loadData(STORAGE_KEYS.REFILLS, []);
      refills.unshift(payload);
      saveData(STORAGE_KEYS.REFILLS, refills);
      renderRefills();
      showToast("به لیست ترمیم ارسال شد");
    });

    function loadSettingsUI() {
      const s = loadData(STORAGE_KEYS.SETTINGS, defaultSettings);
      document.getElementById("brandNameInput").value = s.brandName ?? defaultSettings.brandName;
      document.getElementById("optShowPrice").checked = Boolean(s.showPrice);
      document.getElementById("optShowDeposit").checked = Boolean(s.showDeposit);
      document.getElementById("optShowRemaining").checked = Boolean(s.showRemaining);
      document.getElementById("customFooter").value = s.footer ?? "";
      document.getElementById("salonTitleDisplay").textContent = "دستیار من";
      document.getElementById("salonSubDisplay").textContent = s.brandName ?? defaultSettings.brandName;
    }

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const s = {
        brandName: document.getElementById("brandNameInput").value.trim(),
        showPrice: document.getElementById("optShowPrice").checked,
        showDeposit: document.getElementById("optShowDeposit").checked,
        showRemaining: document.getElementById("optShowRemaining").checked,
        footer: document.getElementById("customFooter").value.trim()
      };
      saveData(STORAGE_KEYS.SETTINGS, s);
      loadSettingsUI();
      showToast("ذخیره شد");
    });

    document.getElementById("enableNotifBtn").addEventListener("click", async () => {
      if (!("Notification" in window)) return;
      const perm = await Notification.requestPermission();
      showToast(perm === "granted" ? "اعلان فعال شد" : "فعال نشد");
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const target = btn.dataset.tab;
        document.getElementById("tab-appointments").classList.toggle("hidden", target !== "appointments");
        document.getElementById("tab-refill").classList.toggle("hidden", target !== "refill");
        document.getElementById("tab-settings").classList.toggle("hidden", target !== "settings");
      });
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    loadSettingsUI();
    renderAppointments();
    renderRefills();
  </script>
</body>
</html>
