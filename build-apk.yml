name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK & Build Tools
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -f cmdline-tools.zip

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Signed APK
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p android-build && cd android-build

          MANIFEST_URL="https://mmp1988.github.io/Dastyare-man/manifest.json"
          echo "بررسی دسترسی به $MANIFEST_URL ..."
          curl -fsSL "$MANIFEST_URL" -o fetched-manifest.json

          # پاسخ خودکار به سؤال‌های احتمالی Bubblewrap (شامل n برای استفاده از JDK 17 موجود)
          printf "n\nn\nn\nn\nn\nn\nn\nn\nn\nn\n" | bubblewrap init --manifest="$MANIFEST_URL" || true

          if [ ! -f twa-manifest.json ]; then
            echo "خطا: twa-manifest.json ساخته نشد. وضعیت manifest.json را بررسی کنید."
            exit 1
          fi

          # تنظیم مستقیم مسیرهای JDK و Android SDK تا سؤال نپرسد
          node -e '
            const fs = require("fs");
            const p = "twa-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(p, "utf8"));
            manifest.jdkPath = process.env.JAVA_HOME;
            manifest.androidSdkPath = process.env.ANDROID_HOME;
            fs.writeFileSync(p, JSON.stringify(manifest, null, 2));
          '

          bubblewrap update --skipPwaValidation
          bubblewrap build --skipPwaValidation

          # ساخت Keystore و امضای نهایی فایل APK
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias dastyare \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dastyare123 \
            -keypass dastyare123 \
            -dname "CN=Mina-Msvm, OU=Dastyare-man, O=Dastyare-man, L=Tehran, S=Tehran, C=IR"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          APK_UNSIGNED=$(find . -name "app-release-unsigned.apk" -o -name "*.apk" | grep -v "aligned.apk" | head -n 1)

          if [ -z "$APK_UNSIGNED" ]; then
            echo "خطا: فایل APK خروجی پیدا نشد."
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-pass pass:dastyare123 \
            --ks-pass pass:dastyare123 \
            --out ../Dastyare-man.apk \
            aligned.apk

      - name: Publish Latest GitHub Release with Dastyare-man.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dastyare-man Latest APK"
          body: "نسخه امضاشده و آماده نصب اپلیکیشن دستیار من (به‌روزرسانی خودکار)"
          files: Dastyare-man.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
