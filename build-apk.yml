name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Signed APK
        run: |
          mkdir -p android-build && cd android-build
          bubblewrap init --manifest=https://mmp1988.github.io/Dastyare-man/manifest.json --yes || true
          # Generate a release keystore if not provided via secrets
          keytool -genkeypair -v -keystore release.keystore -alias dastyare -keyalg RSA -keysize 2048 -validity 10000 -storepass dastyare123 -keypass dastyare123 -dname "CN=Mina-Msvm, OU=Dastyare-man, O=Dastyare-man, L=Tehran, S=Tehran, C=IR"
          bubblewrap build --skipPwaValidation
          # Sign APK with apksigner so it installs cleanly on Android devices
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APK_UNSIGNED=$(find . -name "app-release-unsigned.apk" -o -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -p -f 4 "$APK_UNSIGNED" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-key-pass pass:dastyare123 --ks-pass pass:dastyare123 --out ../Dastyare-man.apk aligned.apk

      - name: Publish Latest GitHub Release with Dastyare-man.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dastyare-man Latest APK"
          body: "نسخه امضاشده و آماده نصب اپلیکیشن دستیار من (به‌روزرسانی خودکار)"
          files: Dastyare-man.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
